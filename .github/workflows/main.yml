<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC Motors - Performance, Care & Custom Bodywork</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #030303;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .background-fx {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      z-index: -2;
    }
    
    .neon-light-left, .neon-light-right {
      position: fixed;
      top: 20%;
      width: 3px;
      height: 400px;
      background-color: #ffcccc;
      box-shadow: 0 0 20px 5px #e50914, 0 0 40px 10px #e50914;
      z-index: -1;
      opacity: 0.5;
    }

    .neon-light-left { left: 2%; transform: rotate(15deg); }
    .neon-light-right { right: 2%; transform: rotate(-15deg); top: 50%; }

    header {
      position: fixed;
      top: 0; width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      border-bottom: 1px solid rgba(229, 9, 20, 0.3);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      z-index: 1000;
    }

    .logo img {
      height: 45px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      color: #cccccc;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #e50914;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&q=80&w=1920') center/cover;
      padding: 0 20px;
      border-bottom: 2px solid #e50914;
    }

    .hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
    }

    .hero h1 span { color: #e50914; }

    .hero p {
      font-size: 1.2rem;
      color: #aaaaaa;
      letter-spacing: 3px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .btn-glow {
      display: inline-block;
      background: linear-gradient(90deg, #cc0000, #e50914);
      color: white;
      text-decoration: none;
      padding: 16px 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
      transition: all 0.3s;
    }

    .btn-glow:hover {
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.8);
      transform: scale(1.05);
    }

    section {
      padding: 100px 20px;
      max-width: 1400px;
      margin: 0 auto;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .section-title span { color: #e50914; }
    
    .section-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 60px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    .feature-card {
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }

    .feature-card:hover {
      border-color: #e50914;
      transform: translateY(-5px);
    }

    .feature-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-bottom: 2px solid #e50914;
    }

    .feature-content {
      padding: 30px;
    }

    .feature-content h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .feature-content p {
      color: #aaaaaa;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .feature-content ul {
      list-style: none;
      color: #cccccc;
      font-size: 0.9rem;
    }

    .feature-content ul li {
      margin-bottom: 10px;
      position: relative;
      padding-left: 20px;
    }

    .feature-content ul li::before {
      content: "►";
      position: absolute;
      left: 0;
      color: #e50914;
      font-size: 0.7rem;
      top: 4px;
    }

    .bodywork-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      margin-bottom: 60px;
    }

    .bodywork-grid:nth-child(even) { direction: rtl; }
    .bodywork-grid:nth-child(even) > * { direction: ltr; }

    .bw-img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(229, 9, 20, 0.4);
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .bw-text h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #e50914;
      text-transform: uppercase;
    }

    .bw-text p {
      font-size: 1.1rem;
      color: #bbbbbb;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .directory-card {
      background: rgba(20, 20, 25, 0.6);
      border: 1px solid rgba(229, 9, 20, 0.2);
      border-radius: 8px;
      padding: 25px;
      transition: border-color 0.3s;
    }

    .directory-card:hover {
      border-color: #e50914;
      background: rgba(30, 30, 35, 0.8);
    }

    .directory-card h4 {
      font-family: 'Montserrat', sans-serif;
      color: #e50914;
      font-size: 1.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .directory-card ul {
      list-style: none;
    }

    .directory-card ul li {
      color: #ccc;
      font-size: 0.95rem;
      margin-bottom: 8px;
      padding-left: 15px;
      position: relative;
    }

    .directory-card ul li::before {
      content: "▪";
      position: absolute;
      left: 0;
      color: #e50914;
    }

    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 25px;
      margin-top: 40px;
    }

    .booking-card {
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .booking-card h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .booking-card i {
      font-size: 3.5rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .center-card {
      border: 1px solid rgba(229, 9, 20, 0.5);
      background: rgba(20, 20, 25, 0.9);
    }

    select.service-dropdown {
      width: 100%;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 30px;
      cursor: pointer;
    }

    select.service-dropdown:focus { border-color: #e50914; outline: none; }
    optgroup { color: #e50914; font-weight: bold; }
    option { color: #fff; }

    footer {
      text-align: center;
      padding: 40px;
      background: #000;
      color: #555;
      font-size: 0.9rem;
      border-top: 1px solid #222;
    }

    @media (max-width: 900px) {
      .grid-3, .dashboard-container, .bodywork-grid { grid-template-columns: 1fr; }
      .bodywork-grid:nth-child(even) { direction: ltr; }
      .nav-links { display: none; }
      .hero h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="background-fx"></div>
  <div class="neon-light-left"></div>
  <div class="neon-light-right"></div>

  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="MAC Motors" onerror="this.src='https://via.placeholder.com/150x45/000000/e50914?text=MAC+MOTORS'">
    </div>
    <div class="nav-links">
      <a href="#performance">Tuning & Stages</a>
      <a href="#care">Elite Car Care</a>
      <a href="#bodywork">Kits & Facelifts</a>
      <a href="#booking">Book Now</a>
    </div>
  </header>

  <section class="hero">
    <h1>MAC <span>MOTORS</span></h1>
    <p>Ultimate Customization, Performance Tuning & Elite Detailing</p>
    <a href="#performance" class="btn-glow">Explore the Garage</a>
  </section>

  <!-- PERFORMANCE TUNING STAGES -->
  <section id="performance">
    <h2 class="section-title">PERFORMANCE <span>TUNING</span></h2>
    <p class="section-subtitle">Engineered calibration and precision hardware upgrades. From optimized daily drivers to track-focused 1000+ WHP monsters.</p>
    
    <div class="grid-3">
      <div class="feature-card">
        <img src="ecu.jpg" alt="Stage 1 Tuning" class="feature-img">
        <div class="feature-content">
          <h3>Stage 1: Calibration</h3>
          <p>Perfect for daily drivers wanting unlocked potential without changing factory hardware.</p>
          <ul>
            <li>Custom ECU Remapping</li>
            <li>AWD Baseline Dyno Pulls</li>
            <li>Throttle response optimization</li>
            <li>Speed limiter removal</li>
          </ul>
        </div>
      </div>
      <div class="feature-card">
        <img src="blower.jpg" alt="Stage 2 Tuning" class="feature-img">
        <div class="feature-content">
          <h3>Stage 2: Bolt-Ons & Flow</h3>
          <p>Aggressive power gains requiring upgraded breathing and exhaust modifications.</p>
          <ul>
            <li>High-flow downpipes & exhaust</li>
            <li>Cold air intake systems</li>
            <li>Upgraded intercooler installation</li>
            <li>Aggressive Stage 2 mapping</li>
          </ul>
        </div>
      </div>
      <div class="feature-card">
        <img src="track.jpg" alt="Stage 3 Build" class="feature-img">
        <div class="feature-content">
          <h3>Stage 3: Max Effort</h3>
          <p>Full engine builds designed to push maximum horsepower and torque to the wheels.</p>
          <ul>
            <li>Turbocharger / Supercharger upgrades</li>
            <li>Forged engine internals</li>
            <li>Upgraded fueling & E85 flex-fuel</li>
            <li>Track-ready cooling systems</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ELITE CAR CARE LEVELS -->
  <section id="care" style="background: rgba(10,10,10,0.6);">
    <h2 class="section-title">ELITE <span>CAR CARE</span></h2>
    <p class="section-subtitle">Preserve and protect. Our detailing bays use premium compounds and coatings to restore factory depth and shield against the elements.</p>
    
    <div class="grid-3">
      <div class="feature-card">
        <img src="essential.jpg" alt="Level 1 Wash" class="feature-img">
        <div class="feature-content">
          <h3>Level 1: Essential Clean</h3>
          <p>A rigorous, scratch-free wash procedure to maintain your vehicle's finish.</p>
          <ul>
            <li>Intense touchless snow foam soak</li>
            <li>Two-bucket microfiber hand wash</li>
            <li>Deep wheel face & barrel decontamination</li>
            <li>Tire dressing & interior blowout</li>
          </ul>
        </div>
      </div>
      <div class="feature-card">
        <img src="clean.jpg" alt="Level 2 Detail" class="feature-img">
        <div class="feature-content">
          <h3>Level 2: Detail & Decon</h3>
          <p>Restores depth and removes embedded contaminants from the clear coat.</p>
          <ul>
            <li>Level 1 Wash included</li>
            <li>Fine clay bar paint decontamination</li>
            <li>Single-stage gloss-enhancement machine polish</li>
            <li>Upholstery steam clean & dash protection</li>
          </ul>
        </div>
      </div>
      <div class="feature-card">
        <img src="best clean.jpg" alt="Level 3 Ceramic" class="feature-img">
        <div class="feature-content">
          <h3>Level 3: Paint Correction & Ceramic</h3>
          <p>The ultimate reset. Removes heavy swirling and protects the paint for years.</p>
          <ul>
            <li>Substantial multi-stage swirl removal (85%+)</li>
            <li>3 to 5-year professional ceramic coating</li>
            <li>Glass & wheel faces fully coated</li>
            <li>Comprehensive interior detailing</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- KITS, FACELIFTS & BODY REPAIR -->
  <section id="bodywork">
    <h2 class="section-title">BODY KITS & <span>FACELIFTS</span></h2>
    <p class="section-subtitle">Whether you need flawless accident repair, a custom widebody kit, or a full "Old to New" facelift transformation, our body shop executes with OEM-level precision.</p>

    <!-- Highlight Showcase -->
    <div class="bodywork-grid">
      <img src="patrol and lc.jpg" alt="Nissan Patrol and LC300" class="bw-img">
      <div class="bw-text">
        <h3>Nissan Patrol & Land Cruiser Conversions</h3>
        <p>Make your old chassis look like it just rolled off the showroom floor. We specialize in complete Old-to-New facelift conversions.</p>
        <p><strong>Includes:</strong> LC200 to LC300 upgrades, Patrol Y61/Y62 modernizations, custom fenders, LED wiring, bumper swaps, and OEM color-matched paint.</p>
      </div>
    </div>

    <div class="bodywork-grid">
      <img src="jdm.jpg" alt="JDM Custom Aero Supra" class="bw-img">
      <div class="bw-text">
        <h3>JDM Custom Aero</h3>
        <p>From aggressive street styling to functional track aerodynamics, we install, fit, and paint high-quality body kits to perfection. Say goodbye to panel gaps.</p>
        <p><strong>Includes:</strong> Type-R style bumper conversions, carbon fiber hoods, widebody overfenders, side skirts, and rear diffusers for Honda, Nissan, and Toyota chassis.</p>
      </div>
    </div>

    <div class="bodywork-grid">
      <img src="images.jpg" alt="Ford Everest Endeavour" class="bw-img">
      <div class="bw-text">
        <h3>Ford Endeavour Mods & Full Paint Restorations</h3>
        <p>Turn your SUV/Truck into an aggressive off-road machine with Raptor-style grilles, lifted suspension accommodations, and rugged bumper kits.</p>
        <p><strong>Painting & Repair:</strong> State-of-the-art downdraft paint booth for flawless color matching, full vehicle resprays, dent pulling, rust repair, and major accident restorations.</p>
      </div>
    </div>

    <!-- Supported Models Directory -->
    <h3 class="section-title" style="font-size: 2rem; margin-top: 80px;">SUPPORTED <span>MODELS & PLATFORMS</span></h3>
    <p class="section-subtitle">We source, fit, and paint premium kits (Liberty Walk, Pandem, Mansory-style, OEM Facelifts) for virtually every major manufacturer. If your car isn't listed, contact us for a custom fabrication quote.</p>
    
    <div class="directory-grid">
      <div class="directory-card">
        <h4>4x4 & SUV Facelifts (Old to New)</h4>
        <ul>
          <li>Toyota Land Cruiser (LC200 ➔ LC300)</li>
          <li>Toyota Prado (2010 ➔ 2024 styling)</li>
          <li>Nissan Patrol (Y61 / Y62 Upgrades)</li>
          <li>Lexus LX (LX570 ➔ LX600)</li>
          <li>Mercedes-Benz G-Wagon (W463 ➔ W463A)</li>
          <li>Range Rover (Vogue & Sport Facelifts)</li>
          <li>Land Rover Defender Aero Kits</li>
          <li>Ford Endeavour / Everest / Bronco</li>
        </ul>
      </div>

      <div class="directory-card">
        <h4>JDM & Tuner Kits</h4>
        <ul>
          <li>Honda Civic (All Gens) & Accord</li>
          <li>Toyota Supra (MK4 & MK5 / A90)</li>
          <li>Toyota 86 / Subaru BRZ / FRS</li>
          <li>Nissan GTR (R35 Facelifts & Widebody)</li>
          <li>Nissan 350Z / 370Z / new Z</li>
          <li>Subaru WRX / STI</li>
          <li>Mitsubishi Lancer Evolution</li>
          <li>Mazda RX-7 & Miata Aero</li>
        </ul>
      </div>

      <div class="directory-card">
        <h4>Euro Luxury & Performance</h4>
        <ul>
          <li>BMW M2 / M3 / M4 (F80, G80 Aero)</li>
          <li>BMW 3-Series / 4-Series / 5-Series</li>
          <li>Audi A3/S3/RS3 & A5/S5/RS5</li>
          <li>Audi RS6 / R8 Body Packages</li>
          <li>Mercedes AMG (C63, E63, A45)</li>
          <li>VW Golf GTI / Golf R (MK6/7/8)</li>
          <li>Porsche 911 (997/991/992) & Cayman</li>
          <li>Lamborghini / Ferrari / McLaren Aero</li>
        </ul>
      </div>

      <div class="directory-card">
        <h4>American Muscle & Truck</h4>
        <ul>
          <li>Ford Mustang (S197, S550 Widebodies)</li>
          <li>Dodge Charger (Hellcat/Redeye Conversions)</li>
          <li>Dodge Challenger (Demon/Widebody Kits)</li>
          <li>Chevrolet Camaro & Corvette (C7/C8)</li>
          <li>Ford F-150 / Raptor Conversions</li>
          <li>Ram 1500 / TRX Styling</li>
          <li>Jeep Wrangler / Gladiator Armor</li>
          <li>Chevrolet Silverado / Tahoe</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- BOOKING DASHBOARD -->
  <section id="booking" style="background: rgba(5,5,5,0.9); border-top: 2px solid #e50914;">
    <h2 class="section-title">LOCK IN YOUR <span>APPOINTMENT</span></h2>
    <p style="text-align: center; color: #e50914; font-weight: bold; margin-bottom: 40px; letter-spacing: 1px;">DIRECT CONTACT REQUIRED FOR BOOKINGS & CUSTOM QUOTES</p>
    
    <div class="dashboard-container">
      <div class="booking-card">
        <h2>OPTION 1:<br>DM ON INSTAGRAM</h2>
        <i class="fa-brands fa-instagram"></i>
        <a href="https://instagram.com/lwk_batman.22" target="_blank" style="text-decoration: none; color: #fff; font-size: 1.2rem; font-weight: bold;">@lwk_batman.22</a>
      </div>

      <div class="booking-card center-card">
        <p style="color: #aaa; margin-bottom: 20px;">Select your service to generate a pre-filled quote request directly to our WhatsApp chat.</p>
        
        <select class="service-dropdown" id="service-select">
          <option value="" disabled selected>-- Select a Service --</option>
          
          <optgroup label="ELITE CAR CARE">
            <option value="Wash Level 1">Level 1: Essential Clean (AED 250)</option>
            <option value="Wash Level 2">Level 2: Detail & Decon (AED 850)</option>
            <option value="Wash Level 3">Level 3: Paint Correction & Ceramic (AED 2,500+)</option>
          </optgroup>

          <optgroup label="PERFORMANCE TUNING">
            <option value="Stage 1 Tune">Stage 1: ECU Remap & Dyno</option>
            <option value="Stage 2 Tune">Stage 2: Bolt-ons & Custom Tune</option>
            <option value="Stage 3 Build">Stage 3: Engine Build & Turbo Upgrade</option>
          </optgroup>

          <optgroup label="BODY KITS & FACELIFTS">
            <option value="SUV Old-to-New Facelift">Old to New Facelift (Patrol / Land Cruiser / LX)</option>
            <option value="Widebody / Aero Kit">Custom Body Kit (JDM / Euro / Muscle)</option>
            <option value="Full Paint and Repair">Full Paint Respray & Accident Repair</option>
          </optgroup>
        </select>

        <a href="https://wa.me/971503821622" class="btn-glow" target="_blank" id="confirm-btn">
          CONFIRM & CHAT NOW
        </a>
      </div>

      <div class="booking-card">
        <h2>OPTION 2:<br>CHAT ON WHATSAPP</h2>
        <i class="fa-brands fa-whatsapp"></i>
        <a href="https://wa.me/971503821622" target="_blank" style="text-decoration: none; color: #fff; font-size: 1.2rem; font-weight: bold;">050 382 1622</a>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 MAC MOTORS LIMITED. ALL RIGHTS RESERVED.</p>
  </footer>

  <script>
    const serviceSelect = document.getElementById('service-select');
    const confirmBtn = document.getElementById('confirm-btn');

    serviceSelect.addEventListener('change', function() {
      const selectedService = this.value;
      const whatsappBaseUrl = "https://wa.me/971503821622?text=";
      const message = encodeURIComponent(`Hey MAC Motors! I'm reaching out from the website to book/inquire about: ${selectedService}`);
      confirmBtn.href = whatsappBaseUrl + message;
    });
  </script>

</body>
</html>
